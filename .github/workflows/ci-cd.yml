name: CI/CD Spring Boot Docker Compose

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:

      # 1️Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️Setup Java 17
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 3️Build project
      - name: Build project
        run: mvn clean package --no-transfer-progress

      # 4️Run tests
      - name: Run tests
        run: mvn test

      # 5️Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 6️Build & start containers
      - name: Start containers
        run: docker compose up -d --build

      # 7️Check running containers
      - name: Check running containers
        run: docker compose ps

      # 8️Wait for API
      - name: Wait for API
        run: |
          for i in {1..20}; do
            if curl -s http://localhost:8090/actuator/health > /dev/null; then
              echo "API is running"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 5
          done
          echo "API failed to start"
          docker compose logs
          exit 1

      # 9️Stop containers
      - name: Stop containers
        if: always()
        run: docker compose down